services:
  # =========================================================
  # SONORA - SINGLE FREE WEB SERVICE
  # =========================================================
  #
  # Everything runs inside one Render container:
  #   FastAPI -> local worker -> yt-dlp -> bgutil -> FFmpeg
  #
  # If YouTube rejects Render's datacenter IP, worker.py automatically
  # falls back to public Piped API instances and converts the returned
  # audio locally with FFmpeg. Cobalt and the remote session-generator
  # are intentionally NOT used.
  - type: web
    name: sonora-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SONORA_LOCAL_WORKER
        value: "true"
      - key: YTDLP_POT_PROVIDER_URL
        value: "http://127.0.0.1:4416"
      - key: YTDLP_JS_RUNTIME
        value: "deno"
      - key: YTDLP_PLAYER_PROFILES
        value: "mweb;web_safari;tv_embedded;web_embedded;android_vr"
      - key: YTDLP_USE_COOKIES
        value: "false"
      - key: PIPED_INSTANCE_TTL
        value: "900"
      - key: PIPED_TIMEOUT
        value: "12"
