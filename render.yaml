services:
  # =========================================================
  # SONORA - SINGLE FREE WEB SERVICE
  # =========================================================
  #
  # Everything runs inside one Render container:
  #   FastAPI -> local worker -> yt-dlp -> bgutil -> FFmpeg
  #
  # YouTube cookies can be uploaded temporarily through the protected
  # /api/cookies/upload endpoint. The cookie file is NOT stored in GitHub.
  - type: web
    name: sonora-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SONORA_LOCAL_WORKER
        value: "true"
      - key: YTDLP_POT_PROVIDER_URL
        value: "http://127.0.0.1:4416"
      - key: YTDLP_JS_RUNTIME
        value: "deno"
      - key: YTDLP_PLAYER_PROFILES
        value: "mweb;web_safari;tv_embedded;web_embedded;android_vr"
      - key: YTDLP_USE_COOKIES
        value: "true"
      # Temporary cookies uploaded through the API expire after 6 hours.
      # The actual cookie contents must NEVER be committed to this repo.
      - key: YTDLP_COOKIES_TTL_SECONDS
        value: "21600"
      # YTDLP_COOKIES_API_KEY must be configured manually as a SECRET in
      # Render Environment before using the cookie upload endpoint.
      - key: PIPED_INSTANCE_TTL
        value: "900"
      - key: PIPED_TIMEOUT
        value: "12"
      # A partir de aqui: las instancias publicas de Piped se prueban EN
      # PARALELO (carrera) en vez de una por una, para no acumular
      # minutos de espera cuando varias estan caidas/con DNS roto.
      - key: PIPED_RACE_DEADLINE
        value: "15"
      - key: PIPED_RACE_TIMEOUT
        value: "8"
      - key: PIPED_RACE_MAX_WORKERS
        value: "8"
      - key: PIPED_RACE_MAX_CANDIDATES
        value: "3"
      - key: PIPED_RACE_GRACE
        value: "1.5"
