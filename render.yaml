services:
  # =========================================================
  # SONORA - SINGLE FREE WEB SERVICE
  # =========================================================
  #
  # Everything runs inside one Render container:
  #   FastAPI -> local worker -> yt-dlp -> bgutil -> FFmpeg
  #
  # Cobalt and the remote yt-session-generator are intentionally NOT used.
  # This avoids the extra Render services and the cross-service YouTube
  # session/IP problem that caused repeated /token 503s and deploy timeouts.
  - type: web
    name: sonora-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SONORA_LOCAL_WORKER
        value: "true"
      - key: YTDLP_POT_PROVIDER_URL
        value: "http://127.0.0.1:4416"
      - key: YTDLP_JS_RUNTIME
        value: "deno"
      - key: YTDLP_PLAYER_PROFILES
        value: "mweb;web_safari;tv_embedded;web_embedded;android_vr"
      # Cookies remain optional and disabled by default. Only enable them
      # when a specific YouTube video actually requires an account session.
      - key: YTDLP_USE_COOKIES
        value: "false"
